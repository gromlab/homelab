# =====================================================================
# ESPHome Package: UPS HID Monitor Configuration
# =====================================================================
# UPS-specific configuration for ESP32-S3-DevKitC-1 boards monitoring
# CyberPower CP1500PFCLCD UPS units via USB HID protocol.
#
# This package adds ONLY the UPS monitoring components to a device.
# Base device configuration (esphome, esp32, wifi, api, ota, logger)
# must be defined in the per-device YAML.
#
# Hardware Requirements:
#   - ESP32-S3-DevKitC-1 with native USB OTG port
#   - USB-C OTG splitter with 5V power injection (e.g., GELRHONR)
#   - USB-A to USB-B cable from splitter to UPS
#
# Key Configuration Notes:
#   - platformio_options with PSRAM/flash flags are REQUIRED for USB
#     host stack initialization - included in this package
#   - hardware_uart: UART0 is REQUIRED to free native USB port from
#     JTAG - must be set in device logger config
#   - flash_size: 16MB must be set in device esp32 config
#   - OTG splitter with external 5V power injection is REQUIRED for
#     UPS USB data line activation
#
# Component: github://gromlab/esphome-components
#   Fork with ESPHome 2026.x sensor compatibility fix
#   Branch: fix/esphome-2026-sensor-compatibility
# =====================================================================


# =====================================================================
# SUBSTITUTIONS - Defaults (override per device if needed)
# =====================================================================
substitutions:
  update_interval: "10s"
  protocol_timeout: "15s"
  ups_protocol: "generic"

# =====================================================================
# PLATFORMIO OPTIONS - Required for USB host stack initialization
# =====================================================================
esphome:
  platformio_options:
    build_flags:
      - -DBOARD_HAS_PSRAM
    board_build.arduino.memory_type: qio_opi
    board_build.f_flash: 80000000L
    board_build.flash_mode: qio


# =====================================================================
# LOGGING - Override to free native USB port from JTAG
# =====================================================================
logger:
  level: DEBUG
  baud_rate: 115200
  hardware_uart: UART0


# =====================================================================
# WEB SERVER - Local status page
# =====================================================================
web_server:
  port: 80


# =====================================================================
# EXTERNAL COMPONENTS - UPS HID (gromlab fork with ESPHome 2026.x fix)
# =====================================================================
external_components:
  - source: github://gromlab/esphome-components@fix/esphome-2026-sensor-compatibility
    components: [ups_hid, nut_server]


# =====================================================================
# UPS HID COMPONENT - CyberPower USB HID protocol
# =====================================================================
ups_hid:
  id: ups_monitor
  update_interval: ${update_interval}
  protocol_timeout: ${protocol_timeout}
  protocol: ${ups_protocol}
  simulation_mode: false


# =====================================================================
# SENSORS - UPS telemetry data
# =====================================================================
sensor:
  - platform: ups_hid
    ups_hid_id: ups_monitor
    name: "Battery Level"
    id: battery_level
    type: battery_level

  - platform: ups_hid
    ups_hid_id: ups_monitor
    name: "Input Voltage"
    id: input_voltage
    type: input_voltage

  - platform: ups_hid
    ups_hid_id: ups_monitor
    name: "Output Voltage"
    id: output_voltage
    type: output_voltage

  - platform: ups_hid
    ups_hid_id: ups_monitor
    name: "Load Percentage"
    id: load_percentage
    type: load_percent

  - platform: ups_hid
    ups_hid_id: ups_monitor
    name: "Runtime Remaining"
    id: runtime_remaining
    type: runtime

  - platform: uptime
    name: "Uptime"
    update_interval: 60s

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s


# =====================================================================
# TEXT SENSORS - UPS identification and status
# =====================================================================
text_sensor:
  - platform: ups_hid
    ups_hid_id: ups_monitor
    name: "UPS Status"
    id: ups_status_text
    type: status

  - platform: ups_hid
    ups_hid_id: ups_monitor
    name: "Detected Protocol"
    type: protocol

  - platform: ups_hid
    ups_hid_id: ups_monitor
    name: "UPS Manufacturer"
    type: manufacturer

  - platform: ups_hid
    ups_hid_id: ups_monitor
    name: "UPS Model"
    type: model

  - platform: wifi_info
    ip_address:
      name: "IP Address"

  - platform: version
    name: "ESPHome Version"


# =====================================================================
# BINARY SENSORS - UPS state flags
# =====================================================================
binary_sensor:
  - platform: ups_hid
    ups_hid_id: ups_monitor
    name: "Battery Charging"
    type: charging

  - platform: ups_hid
    ups_hid_id: ups_monitor
    name: "Overload Warning"
    type: overload

  - platform: ups_hid
    ups_hid_id: ups_monitor
    name: "Online"
    type: online

  - platform: ups_hid
    ups_hid_id: ups_monitor
    name: "On Battery"
    type: on_battery

  - platform: ups_hid
    ups_hid_id: ups_monitor
    name: "Low Battery"
    type: low_battery

  - platform: ups_hid
    ups_hid_id: ups_monitor
    name: "Fault"
    type: fault


# =====================================================================
# BUTTONS - UPS control actions
# =====================================================================
button:
  - platform: ups_hid
    name: "Beeper Enable"
    beeper_action: enable

  - platform: ups_hid
    name: "Beeper Disable"
    beeper_action: disable

  - platform: ups_hid
    name: "Beeper Mute"
    beeper_action: mute

  - platform: ups_hid
    name: "Battery Test Quick"
    test_action: battery_quick


# =====================================================================
# NUMBER - UPS shutdown delay configuration
# =====================================================================
number:
  - platform: ups_hid
    name: "Shutdown Delay"
    delay_type: shutdown


# =====================================================================
# NUT SERVER - Network UPS Tools protocol compatibility
# =====================================================================
nut_server:
  ups_hid_id: ups_monitor
  port: 3493
